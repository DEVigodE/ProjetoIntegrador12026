services:
  postgres:
    image: postgres:18-alpine
    container_name: logdash-postgres
    environment:
      POSTGRES_DB: logdash_db
      POSTGRES_USER: logdash_user
      POSTGRES_PASSWORD: logdash_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - logdash-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logdash_user -d logdash_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_pass
      KC_BOOTSTRAP_ADMIN_USERNAME: logdash_user
      KC_BOOTSTRAP_ADMIN_PASSWORD: logdash_pass
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - logdash-network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 240s

volumes:
  postgres-data:

networks:
  logdash-network:
    driver: bridge
